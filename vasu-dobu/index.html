function placePlayer(){catcher.style.left=(playerX*100)+'%'}function move(clientX){const r=field.getBoundingClientRect();playerX=Math.max(.09,Math.min(.91,(clientX-r.left)/r.width));placePlayer()}function beep(freq=500,dur=.07){if(!sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type='sine';g.gain.value=.045;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur)}catch(e){}}
function say(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),650)}function spawn(){if(active||!running)return;const isDog=Math.random()<.35;const el=document.createElement('div');el.className='item '+(isDog?'dog':'bone');el.innerHTML=isDog?`<img src="${dogURL}" alt="Doberman head" style="width:100%;height:100%">`:'🦴';el.style.left=(6+Math.random()*84)+'%';items.appendChild(el);active={el,isDog,x:parseFloat(el.style.left),y:-9,speed:(.23+Math.random()*.12)*(1+Math.min(score/100,1.3)),caught:false};}
function finish(){running=false;active=null;cancelAnimationFrame(raf);overlay.style.display='flex';$('panel').querySelector('h1').textContent='GAME OVER!';$('panel').querySelector('div').textContent='🐾 🐶 🦴';$('panel').querySelector('p').innerHTML=`Final score: <b>${score}</b><br>${score>=50?'Amazing dog catcher!':'Keep practicing and beat your score!'}`;$('startBtn').textContent='↻ PLAY AGAIN';$('message').textContent='Tip: move your catcher under each falling item.'}
function start(){music.play().catch(()=>{});score=0;lives=3;scoreEl.textContent=score;livesEl.textContent=lives;items.innerHTML='';active=null;playerX=.5;placePlayer();running=true;last=performance.now();spawnAt=0;overlay.style.display='none';$('panel').querySelector('h1').textContent='VASU DOBU';raf=requestAnimationFrame(loop)}function loop(t){if(!running)return;const dt=Math.min((t-last)/1000,.04);last=t;if(!active&&t>spawnAt){spawn();spawnAt=t+250}if(active){const a=active;a.y+=a.speed*dt*100;a.el.style.top=a.y+'%';const cr=catcher.getBoundingClientRect(),ir=a.el.getBoundingClientRect();if(ir.bottom>=cr.top+cr.height*.2&&ir.top<cr.bottom&&ir.right>cr.left+cr.width*.13&&ir.left<cr.right-cr.width*.13){score+=a.isDog?5:1;scoreEl.textContent=score;beep(a.isDog?780:560);say(a.isDog?'+5 DOBERMAN!':'+1 BISCUIT!');a.el.remove();active=null;spawnAt=t+250}else if(a.y>105){a.el.remove();active=null;lives--;livesEl.textContent=lives;beep(180,.12);say('MISSED!');if(lives<=0){finish();return}spawnAt=t+380}}raf=requestAnimationFrame(loop)}
$('startBtn').addEventListener('click',start);$('helpBtn').addEventListener('click',()=>{ $('message').textContent='Catch 🐕 for +5 and 🦴 for +1. Each missed item costs one heart. Move with arrow keys, mouse or touch.';beep(420)});$('soundBtn').addEventListener('click',()=>{sound=!sound;music.muted=!sound;$('soundBtn').textContent=sound?'🔊 Sound: On':'🔇 Sound: Off';if(sound){music.play().catch(()=>{});beep(600)} });window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();playerX=Math.max(.09,Math.min(.91,playerX+(e.key==='ArrowLeft'?-.055:.055)));placePlayer()}if(e.key===' '&&!running){e.preventDefault();start()}});field.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons||e.pointerType==='touch')move(e.clientX)});field.addEventListener('pointerdown',e=>{if(running)move(e.clientX)});window.addEventListener('resize',placePlayer);placePlayer();
})();
</script></body></html>
